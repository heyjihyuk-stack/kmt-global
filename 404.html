<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | KMT Global</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--ink:#0F1C2E;--ink-2:#3B4A5E;--muted:#5E6B7D;--line:#D3DBE5;--blue:#1F4FD1;--red:#BF1019}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px}
main{background:#fff;border:1px solid var(--line);border-radius:6px;padding:40px 36px;max-width:520px;width:100%}
.k{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.k b{color:var(--red);font-weight:500}
h1{font-size:28px;line-height:1.3;margin:14px 0 10px;font-weight:600;letter-spacing:-.015em}
p{color:var(--ink-2);line-height:1.7;font-size:16px}
.en{color:var(--muted);font-size:14px;margin-top:6px}
a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:24px;height:48px;padding:0 20px;border-radius:4px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600}
a.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="k">ERROR <b>404</b> · SHEET NOT FOUND</p>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력되었을 수 있습니다.</p>
  <p class="en">The page you are looking for could not be found.</p>
  <a class="btn" href="/">KMT Global 홈으로 →</a>
</main>
</body>
</html>
